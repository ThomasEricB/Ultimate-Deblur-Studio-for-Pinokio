# Backend manifest. The master validates this strictly (see studio/registry.py)
# and never imports anything from this folder - it only launches
#   .venv/bin/python -m upscale_worker --adapter adapter:SpandrelAdapter ...
schema_version = 1
id = "spandrel"
display_name = "PyTorch (Spandrel)"
description = "One PyTorch environment that runs most single-image restoration architectures through spandrel: ESRGAN / Real-ESRGAN, SwinIR, Swin2SR, HAT, DAT, PLKSR for upscaling and NAFNet, Restormer, SCUNet, FBCNN for deblurring, denoising and JPEG cleanup. Larger install (PyTorch + CUDA)."
protocol_version = "1.0"
adapter = "adapter:SpandrelAdapter"
python = "3.13"
requirements = "requirements.txt"
torch = true

[resources]
gpu = true
estimated_vram_mb = 8000

[capabilities]
tta = true
tiling = true
gpu_id = true
precision = true

[custom_models]
extensions = [".pth", ".safetensors", ".ckpt", ".pt"]
pair = false


