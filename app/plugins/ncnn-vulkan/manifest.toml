# Backend manifest. The master validates this strictly (see studio/registry.py)
# and never imports anything from this folder - it only launches
#   .venv/bin/python -m upscale_worker --adapter adapter:NcnnVulkanAdapter ...
schema_version = 1
id = "ncnn-vulkan"
display_name = "NCNN Vulkan (Upscayl models)"
description = "Runs Upscayl's NCNN models (.param/.bin) on the current upstream Tencent ncnn release through Vulkan - NVIDIA, AMD, Intel and Apple GPUs, no PyTorch. Small environment, fast install."
protocol_version = "1.0"
adapter = "adapter:NcnnVulkanAdapter"
python = "3.13"
requirements = "requirements.txt"
torch = false

[resources]
gpu = true
estimated_vram_mb = 2000

[capabilities]
tta = true
tiling = true
gpu_id = true
precision = true

[custom_models]
# A custom NCNN model is a .param + .bin pair with the same stem.
extensions = [".param", ".bin"]
pair = true

