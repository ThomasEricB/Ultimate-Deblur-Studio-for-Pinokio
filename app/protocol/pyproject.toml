[project]
name = "upscale-protocol"
version = "1.0.0"
description = "Shared master/worker protocol for Deblur Studio backends. Schemas and the headless worker shell only - no Torch, CUDA or backend imports."
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pydantic>=2.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/upscale_protocol", "src/upscale_worker"]
